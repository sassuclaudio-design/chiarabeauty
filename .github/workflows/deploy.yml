name: Pubblica sito
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Scompatta il sito
        run: |
          mkdir -p _site
          if [ -f chiarabeauty-sito.zip ]; then unzip -o chiarabeauty-sito.zip -d _site; fi
          for f in index.html privacy.html condizioni-vendita.html manifest.webmanifest CNAME; do [ -f "$f" ] && cp "$f" _site/ || true; done
          [ -d img ] && cp -r img _site/ || true
          ls -R _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
